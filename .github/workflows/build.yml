name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-desktop:
    name: Desktop App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm typecheck

      # ── VST plugin host (C++, JUCE): ams-plugin-host.exe goes into the installer (resources/plugin-host) ──
      - name: Get the free VST2 headers (FST)
        shell: pwsh
        continue-on-error: true
        run: |
          git clone --depth 1 https://git.iem.at/zmoelnig/FST.git "$env:RUNNER_TEMP/FST"
          if ($LASTEXITCODE -ne 0) { Write-Warning "FST not available: the plugin host is built for VST3 only" }

      - name: Get the ASIO SDK (Steinberg, GPL-3)
        shell: pwsh
        continue-on-error: true
        run: |
          # the first download that works; the SDK folder is the one that holds common/iasiodrv.h
          $urls = @('https://www.steinberg.net/asiosdk', 'https://download.steinberg.net/sdk_downloads/asiosdk_2.3.3_2019-06-14.zip')
          foreach ($u in $urls) {
            try { Invoke-WebRequest -Uri $u -OutFile "$env:RUNNER_TEMP/asiosdk.zip" -MaximumRedirection 5 -UseBasicParsing; Expand-Archive "$env:RUNNER_TEMP/asiosdk.zip" "$env:RUNNER_TEMP/asiosdk" -Force; break } catch { Write-Warning "ASIO SDK not from $u : $_" }
          }
          $h = Get-ChildItem "$env:RUNNER_TEMP/asiosdk" -Recurse -Filter iasiodrv.h -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($h) { "ASIO_SDK=$($h.Directory.Parent.FullName)" | Out-File -Append $env:GITHUB_ENV; Write-Host "ASIO SDK: $($h.Directory.Parent.FullName)" } else { Write-Warning "no ASIO SDK: the host is built without ASIO" }

      - name: Build the plugin host (64-bit and 32-bit)
        shell: pwsh
        run: |
          $fst = if (Test-Path "$env:RUNNER_TEMP/FST") { "$env:RUNNER_TEMP/FST" } else { "" }
          cmake -S packages/plugin-host -B "$env:RUNNER_TEMP/phbuild" -DAMS_FST_DIR="$fst" -DAMS_ASIO_SDK_DIR="$env:ASIO_SDK"
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build "$env:RUNNER_TEMP/phbuild" --config Release --target AMSPluginHost
          if ($LASTEXITCODE -ne 0) { throw "plugin host build failed" }
          $exe = Get-ChildItem "$env:RUNNER_TEMP/phbuild" -Recurse -Filter ams-plugin-host.exe | Select-Object -First 1
          if (-not $exe) { throw "ams-plugin-host.exe not found" }
          Copy-Item $exe.FullName packages/plugin-host/dist/ams-plugin-host.exe -Force
          Get-Item packages/plugin-host/dist/ams-plugin-host.exe | Select-Object Name, Length
          # the 32-bit host for 32-bit plugins (same program, built for x86)
          cmake -S packages/plugin-host -B "$env:RUNNER_TEMP/phbuild32" -A Win32 -DAMS_FST_DIR="$fst" -DAMS_ASIO_SDK_DIR="$env:ASIO_SDK"
          if ($LASTEXITCODE -ne 0) { throw "cmake configure (32-bit) failed" }
          cmake --build "$env:RUNNER_TEMP/phbuild32" --config Release --target AMSPluginHost
          if ($LASTEXITCODE -ne 0) { throw "32-bit plugin host build failed" }
          $exe32 = Get-ChildItem "$env:RUNNER_TEMP/phbuild32" -Recurse -Filter ams-plugin-host.exe | Select-Object -First 1
          if (-not $exe32) { throw "32-bit ams-plugin-host.exe not found" }
          Copy-Item $exe32.FullName packages/plugin-host/dist/ams-plugin-host32.exe -Force
          Get-Item packages/plugin-host/dist/ams-plugin-host32.exe | Select-Object Name, Length

      - name: Build
        run: pnpm build

  plugin-host:
    name: Plugin Host (end-to-end test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libasound2-dev libgl1-mesa-dev xvfb
      - name: Build the host and the test plugin
        run: |
          cmake -S packages/plugin-host -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAMS_BUILD_TEST_PLUGIN=ON
          cmake --build build -j4
          mkdir -p vst3 && cp -r "build/AMSTestGain_artefacts/Release/VST3/AMS Test Gain.vst3" "build/AMSTestSynth_artefacts/Release/VST3/AMS Test Synth.vst3" vst3/
      - name: End-to-end test (scan, load, audio, state, editor)
        run: xvfb-run -a node packages/plugin-host/test/e2e.mjs build/AMSPluginHost_artefacts/Release/ams-plugin-host vst3

  test-server:
    name: Python Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install fastapi uvicorn pydantic anthropic openai httpx pytest pytest-asyncio

        working-directory: apps/server

      - name: Run tests
        run: pytest tests/ -v
        working-directory: apps/server
        continue-on-error: true
