name: Release Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0-alpha)'
        required: true
        default: '0.1.0-alpha'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows Installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Node dependencies
        run: pnpm install

      - name: Type check
        run: pnpm typecheck
        continue-on-error: true

      - name: Build Electron app + NSIS installer
        run: pnpm build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List dist
        run: Get-ChildItem dist -Recurse | Select-Object FullName
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIMusicStudio-Windows
          path: |
            dist/*.exe
            dist/latest.yml
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## AI Music Studio ${{ github.ref_name }}

            ### Install
            Download `AIMusicStudio-Setup-*.exe` below and run it. Unsigned alpha: Windows SmartScreen may warn, choose "More info" then "Run anyway".

            ### First start: AI engines
            The AI backend needs Python 3.10+ (python.org, tick "Add to PATH"). Then open **Settings → AI Engines** and click **Install selected**. The app sets up its own environment, no manual pip needed.

            ### Hardware
            - Windows 10/11 (64-bit)
            - Runs on 8 GB VRAM / 12 GB RAM (automatic low-memory mode), older CPUs, AMD Radeon R9 290 (DirectML) or CPU
            - NVIDIA: pick the CUDA variant in AI Engines

            ### AI chat
            Needs an API key for Claude (Anthropic) or ChatGPT (OpenAI), set in Settings → AI.

            ### MCP
            MCP clients connect to `http://127.0.0.1:8765/mcp` while the app is running.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
