name: Release Windows EXE

on:
  push:
    tags:
      - 'v*'
    # a new version number on main releases itself: no run to start by hand, the in-app update sees it within minutes
    branches: [main]
    paths: ['apps/desktop/package.json']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v (e.g. 0.13.1). Must match apps/desktop/package.json. Creates the tag v<version> and the release.'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  # Which version, and is there something to release? (a push to main that did not change the version, or a version
  # that already has its tag, releases nothing)
  decide:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      go: ${{ steps.v.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then v="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then v="${GITHUB_REF_NAME#v}"
          else v=$(node -p "require('./apps/desktop/package.json').version"); fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          go=true
          if [[ "${{ github.ref }}" == refs/heads/* ]] && git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null 2>&1; then
            echo "v$v is released already: nothing to do"; go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Windows Installer
    needs: decide
    if: needs.decide.outputs.go == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Code signing through SignPath Foundation: switched on as soon as the secret SIGNPATH_API_TOKEN and the
      # repository variable SIGNPATH_ORGANIZATION_ID exist (Settings → Secrets and variables → Actions).
      # Without them the installer is built and released unsigned, as before.
      SIGNPATH_ON: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}

    steps:
      - uses: actions/checkout@v4

      # Started by hand: the version must be the one the app reports, or the in-app update breaks
      - name: Check the version
        shell: pwsh
        run: |
          $v = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ($v -ne '${{ needs.decide.outputs.version }}') { throw "Version ${{ needs.decide.outputs.version }} does not match package.json $v" }

      # The release page starts with the changelog of this version (CHANGELOG.md, section "## <version>").
      # Checked before the long build so a missing section fails within seconds.
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $ver = '${{ needs.decide.outputs.version }}'
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $out = New-Object System.Collections.Generic.List[string]
          $in = $false
          foreach ($l in $lines) {
            if ($l -match '^## ') {
              if ($in) { break }
              if ($l -match ('^## ' + [regex]::Escape($ver) + '(\s|$)')) { $in = $true; continue }
            }
            if ($in) { $out.Add($l) }
          }
          $text = ($out -join "`n").Trim()
          if (-not $text) { throw "CHANGELOG.md has no section '## $ver'. Add what changed in this version first." }
          $static = Get-Content .github/release-notes-footer.md -Raw -Encoding utf8
          $body = "## AI Music Studio v$ver`n`n### What's new`n`n$text`n`n$static"
          Set-Content -Path release-notes.md -Value $body -Encoding utf8

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Node dependencies
        run: pnpm install

      - name: Type check
        run: pnpm typecheck
        continue-on-error: true

      - name: Build Electron app + NSIS installer
        run: pnpm build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List dist
        run: Get-ChildItem dist -Recurse | Select-Object FullName
        shell: pwsh

      - name: Upload the unsigned installer for signing
        id: unsigned
        if: env.SIGNPATH_ON == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the installer (SignPath Foundation)
        if: env.SIGNPATH_ON == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'ai-music-studio' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed

      # The updater checks the installer against the checksum in latest.yml: after signing the file changed,
      # so latest.yml gets the new checksum and size. The old blockmap no longer fits and is left out
      # (the updater then downloads the whole installer, which is fine).
      - name: Use the signed installer and update latest.yml
        if: env.SIGNPATH_ON == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem dist/signed -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $signed) { throw "SignPath returned no .exe" }
          $exe = Get-Item (Join-Path dist $signed.Name)
          Copy-Item $signed.FullName $exe.FullName -Force
          Remove-Item dist/*.blockmap -ErrorAction SilentlyContinue
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "Signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "The installer is not validly signed: $($sig.Status)" }
          $bytes = [IO.File]::ReadAllBytes($exe.FullName)
          $sha = [Convert]::ToBase64String([Security.Cryptography.SHA512]::Create().ComputeHash($bytes))
          $y = Get-Content dist/latest.yml -Raw
          $y = [regex]::Replace($y, '(?m)^(\s*sha512:\s*).*$', "`${1}$sha")
          $y = [regex]::Replace($y, '(?m)^(\s*size:\s*).*$', "`${1}$($bytes.Length)")
          Set-Content dist/latest.yml $y -NoNewline -Encoding utf8
          Get-Content dist/latest.yml

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIMusicStudio-Windows
          path: |
            dist/*.exe
            dist/latest.yml
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # a run started by hand or by a new version on main creates the tag on the commit it built
          tag_name: ${{ format('v{0}', needs.decide.outputs.version) }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          draft: false
          prerelease: false
          make_latest: true
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
