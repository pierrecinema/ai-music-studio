name: Release Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v (e.g. 0.13.1). Must match apps/desktop/package.json. Creates the tag v<version> and the release.'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows Installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Started by hand: the version must be the one the app reports, or the in-app update breaks
      - name: Check the version
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $v = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ($v -ne '${{ inputs.version }}') { throw "Input ${{ inputs.version }} does not match package.json $v" }

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Node dependencies
        run: pnpm install

      - name: Type check
        run: pnpm typecheck
        continue-on-error: true

      - name: Build Electron app + NSIS installer
        run: pnpm build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List dist
        run: Get-ChildItem dist -Recurse | Select-Object FullName
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIMusicStudio-Windows
          path: |
            dist/*.exe
            dist/latest.yml
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          # a run started by hand creates the tag on the commit it built
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## AI Music Studio ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

            ### Install
            Download `AIMusicStudio-Setup-*.exe` below and run it. Unsigned alpha: Windows SmartScreen may warn, choose "More info" then "Run anyway".

            ### First start: AI engines
            The AI backend needs Python 3.10+ (python.org, tick "Add to PATH"). Then open **Settings → AI Engines** and click **Install selected**. The app sets up its own environment, no manual pip needed.

            ### Hardware
            - Windows 10/11 (64-bit)
            - Runs on 8 GB VRAM / 12 GB RAM (automatic low-memory mode) and older CPUs; AMD cards via DirectML (very old cards may need the CPU variant)
            - NVIDIA: pick the CUDA variant in AI Engines

            ### AI chat
            Needs an API key for Claude (Anthropic) or ChatGPT (OpenAI), set in Settings → AI.

            ### MCP
            MCP clients connect to `http://127.0.0.1:38765/mcp` while the app is running.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
