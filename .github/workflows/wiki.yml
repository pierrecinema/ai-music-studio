name: Publish wiki

# Copies docs/wiki into the GitHub wiki of this repository, so the wiki is edited like the rest of the docs
# (in pull requests) and stays in step with every release. The wiki must exist once: open the Wiki tab on GitHub
# and save the first page; after that this workflow replaces all pages.
on:
  push:
    branches: [main]
    paths: ['docs/wiki/**', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "::error::The wiki does not exist yet. Open https://github.com/${GITHUB_REPOSITORY}/wiki, click 'Create the first page', save it, then run this workflow again."
            exit 1
          fi

      - name: Copy the pages
        run: |
          find wiki -maxdepth 1 -type f -name '*.md' -delete
          cp docs/wiki/*.md wiki/

      - name: Push
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is up to date."
            exit 0
          fi
          git commit -m "Update the wiki from docs/wiki (${GITHUB_SHA::7})"
          git push
